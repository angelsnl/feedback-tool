name: CI/CD Pipeline

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      force_apply: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build, terraform]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName ${{ vars.DEPLOY_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF
      - name: Write env file
        run: |
          cat > deploy.env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          PORT=3000
          IMAGE_TAG=${{ github.sha }}
          ORIGIN=http://${{ vars.DEPLOY_HOST }}:3000
          EOF
      - name: Sync files
        run: |
          rsync -az docker-compose.yml deploy:/opt/feedback-tool/
          rsync -az deploy.env deploy:/opt/feedback-tool/.env
      - name: Pull and restart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | \
            ssh deploy "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin"
          ssh deploy '
            cd /opt/feedback-tool
            docker compose pull
            docker compose up -d
          '
