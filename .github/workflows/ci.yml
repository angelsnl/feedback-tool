name: CI/CD Pipeline

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check-terraform:
    runs-on: ubuntu-latest
    outputs:
      needs_apply: ${{ steps.check.outputs.needs_apply }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check Terraform Changes
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^terraform/'; then
            echo "needs_apply=true" >> $GITHUB_OUTPUT
          else
            echo "needs_apply=false" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  apply:
    runs-on: ubuntu-latest
    needs: [check-terraform]
    if: ${{ needs.check-terraform.outputs.needs_apply == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: terraform init
        working-directory: terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_CLOUD_KEY }}
          TF_WORKSPACE: feedback-tool-${{ github.ref_name }}
      - name: Apply
        run: terraform apply -auto-approve
        working-directory: terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_CLOUD_KEY }}
          TF_VAR_upcloud_token: ${{ secrets.UPCLOUD_KEY }}
          TF_VAR_github_token: ${{ secrets.TERRAFORM_GITHUB_KEY }}
          TF_WORKSPACE: feedback-tool-${{ github.ref_name }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build, apply]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName ${{ vars.DEPLOY_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF
      - name: Write env file
        run: |
          cat > deploy.env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          PORT=3000
          IMAGE_TAG=${{ github.sha }}
          ORIGIN=http://${{ vars.DEPLOY_HOST }}:3000
          EOF
      - name: Sync files
        run: |
          rsync -az docker-compose.yml deploy:/opt/feedback-tool/
          rsync -az deploy.env deploy:/opt/feedback-tool/.env
      - name: Pull and restart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | \
            ssh deploy "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin"
          ssh deploy '
            cd /opt/feedback-tool
            docker compose pull
            docker compose up -d
          '
