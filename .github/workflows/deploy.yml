name: Deploy
on:
  push:
    branches: [dev]
  workflow_dispatch:
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName ${{ vars.DEPLOY_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF
      - name: Write env file
        run: |
          cat > deploy.env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          PORT=3000
          IMAGE_TAG=${{ github.sha }}
          ORIGIN=http://${{ vars.DEPLOY_HOST }}:3000
          EOF
      - name: Sync files
        run: |
          rsync -az docker-compose.yml deploy:/opt/feedback-tool/
          rsync -az deploy.env deploy:/opt/feedback-tool/.env
      - name: Pull and restart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | \
            ssh deploy "docker login ghcr.io -u $GITHUB_ACTOR --password-stdin"
          ssh deploy '
            cd /opt/feedback-tool
            docker compose pull
            docker compose up -d
          '
